name: CI/CD Pipeline

on:
  push:
    branches:
      - staging
      - main
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build the application
        run: |
          echo "Packaging Flask app..."
          tar -czf flask_app.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask_app
          path: flask_app.tar.gz

  deploy-to-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: flask_app

      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/flask-staging
            tar -xzf flask_app.tar.gz -C ~/flask-staging
            cd ~/flask-staging
            python3 -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            nohup ./venv/bin/python flask_app.py > app.log 2>&1 &

  deploy-to-production:
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Copy deploy.sh to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.sh"
          target: "~/flask-app"

      - name: Run deploy.sh on Production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x ~/flask-app/deploy.sh
            cd ~/flask-app
            ./deploy.sh production ${{ github.event.release.tag_name }}
